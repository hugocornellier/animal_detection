name: animal_detection_example
description: Animal detection example app
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.5'

dependencies:
  flutter:
    sdk: flutter
  animal_detection:
    path: ../
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  file_selector_macos: ^0.9.5
  opencv_dart: ^2.2.2
  dartcv4: ^2.3.1
  flutter_litert: ^3.9.1
  camera: ^0.12.0
  camera_desktop: ^1.2.2
  sensors_plus: ^6.1.1
  video_player: ^2.9.2
  path_provider: ^2.1.5

dependency_overrides:
  video_player_avfoundation: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    dartcv4:
      # Xcode 27 rejects deployment targets below iOS 15. Hook user-defines are
      # only honoured from the root package, so every consuming app sets this.
      ios:
        deployment_target: '15.0'
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - integration_test/test_images/
