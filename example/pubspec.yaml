name: animal_detection_example
description: Animal detection example app
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  animal_detection:
    path: ../
  image_picker: ^1.2.1
  file_selector: ^1.1.0
  file_selector_macos: ^0.9.5
  opencv_dart: 2.2.1+4
  flutter_litert: ^3.8.0
  camera: ^0.12.0
  camera_desktop: ^1.2.1
  sensors_plus: ^6.1.1
  video_player: ^2.9.2
  path_provider: ^2.1.5

dependency_overrides:
  video_player_avfoundation: 2.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    dartcv4:
      include_modules:
        - imgcodecs
        - imgproc
        - videoio

flutter:
  uses-material-design: true
  assets:
    - assets/samples/
    - integration_test/test_images/
